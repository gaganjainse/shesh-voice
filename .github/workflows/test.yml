name: Tests

on:
  push:
    branches: [master, main]
  pull_request:

# Least privilege by default; jobs that write declare it explicitly.
permissions: read-all
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  overlay:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install tools
        run: pip install ruff pytest -q
      - name: Lint overlay + tests (upstream src/ is not restyled — scoped gate)
        run: ruff check shesh-overlay/ tests/
      - name: Overlay + source-sanity tests
        run: python -m pytest tests/ -q
