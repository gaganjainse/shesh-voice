on:
  push:
    branches: [ master ]

# Least privilege by default; jobs that write declare it explicitly.
permissions: read-all
name: Flatpak Build
jobs:
  flatpak:
    name: "Flatpak"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-48
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v7.0.1
        with:
          fetch-depth: 0
      - name: Flatpak build
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: newelle.flatpak
          manifest-path: io.github.qwersyk.Newelle.json
          cache-key: flatpak-builder-${{ github.sha }}
